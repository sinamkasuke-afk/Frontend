<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Student Enrollment | School Facilities Reservation System
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="css/base.css"
  />

  <link
    rel="stylesheet"
    href="css/pages/admin-requests.css"
  />
  <link rel="stylesheet" href="css/components/admin-layout.css?v=admin-name-1" />
  <link rel="stylesheet" href="css/components/reservation-detail.css?v=detail-modal-1">
</head>

<body>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="admin-header">

    <div class="admin-header__brand">

      <div class="admin-header__logo">
        ▥
      </div>

      <strong>
        SCHOOL
      </strong>

      <span class="admin-header__divider"></span>

      <p>
        Facilities Reservation System
      </p>

    </div>


    <div class="admin-header__right">


      <!-- GLOBAL SEARCH -->

      <div class="admin-header-search">

        <span>
          ⌕
        </span>

        <input
          type="text"
          id="global-search"
          placeholder="Search requests, venues, or users..."
        />

      </div>


      <div class="admin-profile-wrapper">
        <button type="button" class="admin-profile" id="admin-profile-button"
          aria-expanded="false" aria-controls="admin-profile-menu">
          <span class="admin-profile__avatar" id="admin-avatar">AS</span>
          <span class="admin-profile__text">
            <strong id="admin-display-name">Administrator</strong>
            <span>Administrator</span>
          </span>
          <span class="admin-profile__arrow" aria-hidden="true">⌄</span>
        </button>
        <div class="admin-profile-menu" id="admin-profile-menu" inert>
          <a href="admin-login.html" class="admin-profile-menu__logout" data-logout>
            <span aria-hidden="true">↪</span> Logout
          </a>
        </div>
      </div>
    </div>

  </header>


  <!-- =====================================================
       APP SHELL
       ===================================================== -->

  <main class="admin-shell">


    <!-- ===================================================
         HOVER SIDEBAR
         =================================================== -->

    <aside class="admin-sidebar">

      <nav class="admin-sidebar__nav">


        <!-- DASHBOARD -->

        <a
          href="admin-dashboard.html"
          class="admin-sidebar__link"
        >

          <span class="admin-sidebar__icon">
            ▦
          </span>

          <span class="admin-sidebar__text">
            Dashboard
          </span>

        </a>


        <!-- REQUESTS -->

        <a
          href="admin-requests.html"
          class="
            admin-sidebar__link
            
          "
        >

          <span class="admin-sidebar__icon">
            ▤
          </span>

          <span class="admin-sidebar__text">
            Requests
          </span>

        </a>


        <!-- HISTORY -->

        <a
          href="admin-history.html"
          class="admin-sidebar__link"
        >

          <span class="admin-sidebar__icon">
            ◷
          </span>

          <span class="admin-sidebar__text">
            History
          </span>

        </a>


        <!-- CALENDAR -->

        <a
          href="admin-calendar.html"
          class="admin-sidebar__link"
        >

          <span class="admin-sidebar__icon">
            ▣
          </span>

          <span class="admin-sidebar__text">
            Calendar
          </span>

        </a>

        <a href="admin-students.html" class="admin-sidebar__link admin-sidebar__link--active">
          <span class="admin-sidebar__icon" aria-hidden="true">♙</span>
          <span class="admin-sidebar__text">Students</span>
        </a>
      </nav>


      <!-- LOGOUT -->

    </aside>


    <!-- ===================================================
         MAIN REQUESTS CONTENT
         =================================================== -->

    <section class="requests-main">
      <h1>Student enrollment</h1>
      <p>Check the student's ID against your school records before approving enrollment. Email verification is required separately.</p>
      <div class="requests-panel" style="margin-top:24px;padding:20px">
        <table class="requests-table">
          <thead><tr><th>Name</th><th>Email</th><th>Student ID</th><th>Enrollment</th><th>Actions</th></tr></thead>
          <tbody id="student-rows"></tbody>
        </table>
        <nav aria-label="Student pages" style="display:flex;gap:16px;justify-content:center;padding:20px">
          <button id="students-previous" type="button" disabled>Previous</button>
          <span id="students-page">Loading…</span>
          <button id="students-next" type="button" disabled>Next</button>
        </nav>
      </div>
    </section>
  </main>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase/config.js?v=paging-enrollment-1"></script>
  <script src="js/data/sample-data.js?v=paging-enrollment-1"></script>
  <script src="js/firebase/reservation-service.js?v=hardening-1"></script>
  <script src="js/firebase/request-pagination.js?v=paging-enrollment-1"></script>
  <script src="js/firebase/client.js?v=hardening-1"></script>
<script
    src="js/pages/admin-students.js?v=hardening-1"
  ></script>

  <script src="js/components/admin-profile.js?v=admin-name-1"></script>
</body>
</html>
